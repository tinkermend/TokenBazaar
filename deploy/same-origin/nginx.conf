# Same-origin reverse proxy: PriceAI portal + TokenBazaar console on one domain.
# Contract: docs/PRICEAI_PORTAL_NAV_SPEC.md §8.1 — machine-readable in ./route-map.json
#
# Upstreams:
#   PriceAI      Next.js                          127.0.0.1:3000
#   TokenBazaar  Go binary with embedded SPA      127.0.0.1:8080  (serves both the
#                                                 console and /api/v1)
#
# Routing rule: everything defaults to PriceAI; only the prefixes listed below go to
# TokenBazaar. Keep this map and route-map.json in sync — the CI guard
# (frontend/src/router/__tests__/sameOriginRouteMap.spec.ts) only checks the JSON.

# Literal addresses, not upstream names: proxy_pass with a variable would otherwise
# need a resolver.
map $uri $portal_backend {
    default                                     http://127.0.0.1:3000;

    # --- TokenBazaar API ------------------------------------------------------
    # Longest-match wins over PriceAI's own /api/* route handlers (constraint B).
    # PriceAI must never add an /api/v1 prefix.
    ~^/api/v1(/|$)                              http://127.0.0.1:8080;

    # --- TokenBazaar auth callbacks (constraint A) ----------------------------
    # Routing all of /auth/* to PriceAI breaks OAuth / OIDC / WeChat / DingTalk
    # login and WeChat payment. Only /auth/tokenbazaar/* belongs to the portal.
    ~^/auth/callback$                           http://127.0.0.1:8080;
    ~^/auth/oidc/callback$                      http://127.0.0.1:8080;
    ~^/auth/linuxdo/callback$                   http://127.0.0.1:8080;
    ~^/auth/wechat/callback$                    http://127.0.0.1:8080;
    ~^/auth/wechat/payment/callback$            http://127.0.0.1:8080;
    ~^/auth/dingtalk/callback$                  http://127.0.0.1:8080;
    ~^/auth/dingtalk/email-completion$          http://127.0.0.1:8080;

    # --- TokenBazaar console and account pages --------------------------------
    ~^/(login|register|logout|forgot-password|reset-password|email-verify|setup)(/|$)   http://127.0.0.1:8080;
    ~^/(console|dashboard|keys|key-usage|usage|profile|orders|subscriptions|purchase)(/|$)  http://127.0.0.1:8080;
    ~^/(redeem|monitor|affiliate|batch-image|available-channels|home)(/|$)              http://127.0.0.1:8080;
    ~^/(payment|custom|legal)(/|$)                                                      http://127.0.0.1:8080;

    # --- /admin ---------------------------------------------------------------
    # Resolved 2026-07-31 (option A): PriceAI Admin lives at /pa-admin, which falls
    # through to the default. /admin is TokenBazaar's alone — no sub-path split.
    ~^/admin(/|$)                               http://127.0.0.1:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # Token gateway uploads (batch image, imports).
    client_max_body_size 64m;

    location / {
        proxy_pass $portal_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Streamed LLM responses must not be buffered or they arrive in one chunk at the end.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}

server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

# Put this in the http{} block if it is not already defined:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
